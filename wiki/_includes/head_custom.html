<script>
  /* The profession pages list tools, consumables, suppliers and customers in tables right after a
     bold label such as "Tools:". Those tables have no header: their first Markdown row is data, so
     they are marked here and drawn with every row alike (_sass/custom/custom.scss). Block comments
     only: the theme joins the page onto one line, which a line comment would swallow. */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.main-content p').forEach(function (p) {
      var label = p.firstChild;
      if (!label || label.nodeName !== 'STRONG' || !/:\s*$/.test(label.textContent)) return;
      var next = p.nextElementSibling;
      if (next && next.classList.contains('table-wrapper')) next.classList.add('vaw-headerless');
    });
  });

  /* A frame marked vaw-fit-frame, such as the graph on the Supply Chain page, is made as tall as the
     page inside it, which unpacks itself after loading, reflows with the width and grows when a
     villager is selected. That page stretches to fill its frame, so it is measured with the frame
     collapsed, while its parent holds the space so the page around it does not jump. Until the
     page has unpacked it measures nothing, and the frame keeps its height. */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('iframe.vaw-fit-frame').forEach(function (frame) {
      var pending = false;
      function fit() {
        pending = false;
        var doc = frame.contentDocument;
        if (!doc || !doc.documentElement) return;
        var holder = frame.parentNode, before = frame.style.height;
        holder.style.minHeight = holder.offsetHeight + 'px';
        frame.style.height = '0px';
        var height = doc.documentElement.scrollHeight;
        frame.style.height = height > 0 ? height + 'px' : before;
        holder.style.minHeight = '';
      }
      function schedule() {
        if (!pending) { pending = true; requestAnimationFrame(fit); }
      }
      function watch() {
        fit();
        new MutationObserver(schedule).observe(frame.contentDocument,
          { subtree: true, childList: true, attributes: true, characterData: true });
      }
      var loaded = frame.contentDocument;
      if (loaded && loaded.readyState === 'complete' && loaded.URL !== 'about:blank') watch();
      frame.addEventListener('load', watch);
      window.addEventListener('resize', schedule);
    });
  });
</script>
