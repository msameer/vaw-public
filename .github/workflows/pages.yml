name: wiki

# Builds wiki/ and publishes it at https://msameer.github.io/vaw-public/. The mod's release copies
# its wiki here, so this site always describes the version players can download.
on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./wiki
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
